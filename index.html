<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GranBoard Pro - Ultimate</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --primary: #10b981;
            --danger: #ef4444;
            --accent: #f59e0b;
            --blue: #3b82f6;
            --purple: #8b5cf6;
            --text: #f8fafc;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 10px;
            user-select: none;
            padding-bottom: 40px;
        }
        .app { max-width: 500px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
        
        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--card); padding: 10px 14px; border-radius: 14px;
        }
        .badge {
            padding: 5px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: bold;
            background: rgba(239,68,68,0.2); color: var(--danger); border: 1px solid var(--danger);
        }
        .badge.ok { background: rgba(16,185,129,0.2); color: var(--primary); border-color: var(--primary); }
        
        .btn {
            border: none; border-radius: 12px; padding: 12px; font-weight: 800;
            font-size: 0.95rem; color: white; cursor: pointer; display: flex;
            align-items: center; justify-content: center; gap: 6px;
        }
        .btn:active { transform: scale(0.97); }
        .btn-blue { background: var(--blue); }
        .btn-green { background: var(--primary); }
        .btn-red { background: var(--danger); }
        .btn-orange { background: var(--accent); color: #000; }
        .btn-purple { background: var(--purple); }
        .btn-dark { background: #334155; }
        
        .setup-bar {
            display: grid;
            grid-template-columns: 1fr auto auto;
            gap: 6px;
            background: var(--card);
            padding: 10px;
            border-radius: 14px;
        }
        select {
            background: #0f172a; color: white; border: 1px solid #334155;
            padding: 10px; border-radius: 10px; font-weight: bold; font-size: 0.9rem;
        }
        
        .profile-bar {
            background: rgba(139, 92, 246, 0.15);
            border: 1px dashed var(--purple);
            border-radius: 14px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .shield-banner {
            background: rgba(245, 158, 11, 0.15); border: 2px solid var(--accent);
            color: var(--accent); padding: 12px; border-radius: 14px; text-align: center;
            font-weight: 800; display: none; animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        
        .players-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .p-card {
            background: var(--card); border-radius: 14px; padding: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 2px solid transparent;
        }
        .p-card.active { border-color: var(--accent); background: rgba(245,158,11,0.08); }
        .p-info { display: flex; flex-direction: column; align-items: flex-start; flex-grow: 1; }
        .p-name { font-size: 1rem; font-weight: 800; color: #94a3b8; display: flex; align-items: center; gap: 8px; }
        .p-name.active-name { color: white; }
        .p-stats-label { font-size: 0.7rem; color: #64748b; margin-top: 2px; }
        .p-score { font-size: 2.2rem; font-weight: 900; color: white; }
        .p-card.active .p-score { color: var(--accent); }
        .p-darts { display: flex; gap: 6px; font-size: 0.85rem; margin-top: 4px; }
        .dart-pill { background: #0f172a; padding: 2px 8px; border-radius: 6px; color: var(--accent); font-weight: bold; }
        
        .btn-action-player {
            background: none; border: none; font-size: 1.2rem; cursor: pointer; padding: 5px;
        }
        
        .cricket-board {
            background: var(--card); border-radius: 14px; padding: 10px; display: none;
        }
        .c-grid-header {
            display: grid; grid-template-columns: repeat(9, 1fr);
            text-align: center; font-weight: bold; font-size: 0.75rem; color: #94a3b8;
            padding-bottom: 6px; border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .c-grid-row {
            display: grid; grid-template-columns: repeat(9, 1fr); align-items: center;
            text-align: center; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.06); font-weight: bold;
        }
        .c-grid-name { text-align: left; font-size: 0.8rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .c-cell-num { color: var(--accent); font-size: 0.85rem; }

        .last-hit-box {
            background: var(--card); border-radius: 14px; padding: 12px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .hit-big { font-size: 1.8rem; font-weight: 900; color: var(--accent); }
        
        .actions-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        
        /* Modales */
        .modal-bg {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85);
            display: none; align-items: center; justify-content: center; padding: 15px; z-index: 100;
        }
        .modal {
            background: var(--card); width: 100%; max-width: 440px; border-radius: 18px;
            padding: 16px; border: 1px solid #475569;
            max-height: 90vh; overflow-y: auto;
        }
        .num-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin: 10px 0; }
        .num-btn {
            background: #0f172a; color: white; border: 1px solid #334155;
            padding: 12px 0; border-radius: 8px; font-weight: 800; font-size: 1rem;
        }
        .num-btn.sel { background: var(--accent); color: #000; border-color: var(--accent); }
        .mult-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
        .log-box {
            background: #020617; color: #38bdf8; font-family: monospace;
            font-size: 0.72rem; padding: 10px; border-radius: 10px; height: 80px; overflow-y: auto;
        }

        .stats-section {
            margin-top: 15px;
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            padding: 12px;
        }
        .stats-title {
            font-weight: 800;
            font-size: 0.9rem;
            color: var(--accent);
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        .ranking-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 0.85rem;
        }
        .bar-container {
            width: 100%;
            background: rgba(255,255,255,0.1);
            height: 8px;
            border-radius: 4px;
            margin-top: 4px;
            overflow: hidden;
        }
        .bar-fill {
            background: var(--primary);
            height: 100%;
            border-radius: 4px;
        }
        .comparison-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            text-align: center;
            margin-top: 10px;
        }
        .comparison-card {
            background: #0f172a;
            padding: 10px;
            border-radius: 10px;
        }

        .input-text-modern {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            font-weight: bold;
            font-size: 1rem;
            margin: 10px 0;
        }
    </style>
</head>
